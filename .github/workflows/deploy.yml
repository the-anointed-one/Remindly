name: Deploy (legacy VPS)

# Superseded by Railway (API + workers) and Vercel (frontend), which both
# deploy automatically on push to main. This SSH/docker-compose pipeline is
# kept for the self-hosted path only and no longer runs on push — it would
# fail on every commit without DEPLOY_HOST et al. Run it by hand from the
# Actions tab if you go back to a VPS.
on:
  workflow_dispatch:

# Only one deploy runs at a time; new pushes cancel the previous run
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # CI must pass first — deploy only runs if this succeeds
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Rebuilding and restarting services"
            docker compose pull postgres redis  # pull upstream image updates
            docker compose up -d --build --remove-orphans \
              --scale worker=2 \
              --scale campaign-worker=2

            echo "==> Waiting for API health check"
            for i in $(seq 1 12); do
              STATUS=$(docker compose exec -T api wget -qO- http://localhost:3000/api/health/live 2>/dev/null && echo "ok" || echo "fail")
              if [ "$STATUS" = "ok" ]; then
                echo "API is healthy"
                break
              fi
              echo "Attempt $i/12 — waiting 10s..."
              sleep 10
            done

            echo "==> Pruning old Docker images"
            docker image prune -f

            echo "==> Deploy complete"
