# ────────────────────────────────────────────────────
# Meetora — Docker Compose (Production Stack)
# ────────────────────────────────────────────────────
# SCALABILITY STRATEGY:
#
# 1. API:      Stateless, scale horizontally: `docker compose up --scale api=3`
# 2. Worker:   Independent process, scale: `docker compose up --scale worker=5`
# 3. Postgres: Single primary; add read replicas for read scaling
# 4. Redis:    Single instance; upgrade to Redis Cluster for HA
# 5. Frontend: Static/SSR, scale behind CDN/LB
#
# MONITORING HOOKS:
# - Health:  GET /api/health       (full check: DB + memory + disk)
# - Live:    GET /api/health/live   (Kubernetes liveness probe)
# - Ready:   GET /api/health/ready  (Kubernetes readiness probe)
# ────────────────────────────────────────────────────

services:
  # ── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: remindly
      POSTGRES_USER: remindly
      POSTGRES_PASSWORD: ${DB_PASSWORD:-REDACTED_SECRET}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U remindly" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://remindly:${DB_PASSWORD:-REDACTED_SECRET}@postgres:5432/remindly
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY}
      PAYSTACK_SMS_PLAN_CODE: ${PAYSTACK_SMS_PLAN_CODE}
      PAYSTACK_SMS_VOICE_PLAN_CODE: ${PAYSTACK_SMS_VOICE_PLAN_CODE}
      PAYSTACK_SMS_VOICE_AI_PLAN_CODE: ${PAYSTACK_SMS_VOICE_AI_PLAN_CODE}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL}
      GOOGLE_REVIEWS_REDIRECT_URI: ${GOOGLE_REVIEWS_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI}
      OUTLOOK_REDIRECT_URI: ${OUTLOOK_REDIRECT_URI}
      API_BASE_URL: ${API_BASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      X_QA_BYPASS_TOKEN: ${X_QA_BYPASS_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ALLOW_TRIAL_WITHOUT_CARD: ${ALLOW_TRIAL_WITHOUT_CARD:-false}
      DEFAULT_PLAN_PRICES: ${DEFAULT_PLAN_PRICES}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/live" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Reminder Worker ────────────────────────────
  # For local dev scaling: docker compose up --scale worker=2
  # For Swarm deployment: deploy.replicas is used automatically
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: [ "node", "dist/workers/reminder.worker.js" ]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://remindly:${DB_PASSWORD:-REDACTED_SECRET}@postgres:5432/remindly
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      API_BASE_URL: ${API_BASE_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_COUNT: ${WORKER_COUNT:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep node | grep reminder.worker.js || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Campaign Worker ────────────────────────────
  # For local dev scaling: docker compose up --scale campaign-worker=2
  # For Swarm deployment: deploy.replicas is used automatically
  campaign-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: [ "node", "dist/workers/campaign.worker.js" ]
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://remindly:${DB_PASSWORD:-REDACTED_SECRET}@postgres:5432/remindly
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      API_BASE_URL: ${API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_COUNT: ${WORKER_COUNT:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep node | grep campaign.worker.js || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        # TEMPORARY — dev/test only. Remove alongside the checkout page's
        # "skip payment" button and the /billing/test-checkout route.
        - NEXT_PUBLIC_QA_BYPASS_TOKEN=${QA_BYPASS_TOKEN:-}
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}

volumes:
  pgdata:
  redisdata:
